services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-floor}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-floor}
      # Day/night boundaries are wall-clock; keep the server on the same zone.
      - TZ=${TZ:-UTC}
    # Exposed on the host only so psql and the Notion import can reach it; the
    # app talks over the compose network, never through this port.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-floor} -d ${POSTGRES_DB:-floor}']
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-floor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-floor}
      - SESSION_SECRET=${SESSION_SECRET}
      - APP_PIN=${APP_PIN}
      - TZ=${TZ:-UTC}
    # Only reachable through nginx on the host
    ports:
      - "127.0.0.1:3000:3000"
    # Enrolled passkeys (WebAuthn credentials) survive rebuilds
    volumes:
      - webauthn-data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  webauthn-data:
  pgdata:
